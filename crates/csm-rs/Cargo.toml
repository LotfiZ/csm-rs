[package]
name = "csm-rs"
version = "0.1.0"
edition.workspace = true
rust-version = "1.70"
license.workspace = true
repository.workspace = true
homepage = "https://github.com/LotfiZ/csm-rs"
keywords = ["lidar", "scan-matching", "icp", "robotics", "slam"]
categories = ["science::robotics", "algorithms"]
description = "Rust port of the Canonical Scan Matcher (Censi 2007): point-to-line ICP with closed-form covariance"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]

[dev-dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
