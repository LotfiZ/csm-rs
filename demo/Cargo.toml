[package]
name = "csm-rs-demo"
version = "0.1.0"
edition = "2021"
publish = false
description = "Local interactive demonstration for the csm-rs library"

[dependencies]
csm-rs = { path = ".." }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
